<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finanças</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #222222;
    --hint: #8e8e93;
    --button: #2481cc;
    --button-text: #ffffff;
    --secondary-bg: #f0f0f0;
    --destructive: #e53935;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px 16px 32px;
  }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .aviso {
    background: var(--secondary-bg);
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 6px;
    border: none;
    border-radius: 10px;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--button);
    color: var(--button-text);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 14px 0 6px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="number"], input[type="text"], input[type="date"], input[type="month"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--secondary-bg);
    border-radius: 10px;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
  }
  .segmentado {
    display: flex;
    gap: 6px;
  }
  .segmentado button {
    flex: 1;
    padding: 10px 4px;
    border: none;
    border-radius: 10px;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .segmentado button.selected {
    background: var(--button);
    color: var(--button-text);
  }
  .btn-principal {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--button);
    color: var(--button-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-principal:disabled { opacity: 0.6; }
  .btn-perigo { background: var(--destructive); }
</style>
</head>
<body>

<div id="aviso-fora" class="aviso" style="display:none">
  ⚠️ Abra este app pelo botão de menu do bot no Telegram (ícone ao lado da caixa de mensagem).
</div>

<div id="app" style="display:none">

  <nav class="tabs">
    <button class="tab-btn active" data-tab="lancar">📥 Lançar</button>
    <button class="tab-btn" data-tab="saldo">💰 Saldo</button>
    <button class="tab-btn" data-tab="relatorio">📊 Relatório</button>
    <button class="tab-btn" data-tab="resetar">🔄 Resetar</button>
  </nav>

  <!-- LANÇAR -->
  <section id="tab-lancar" class="tab-panel active">
    <h2>Novo lançamento</h2>
    <form id="form-lancar">
      <label>Tipo</label>
      <div class="segmentado" id="tipo-lancar">
        <button type="button" data-valor="entrou" class="selected">💵 Entrou</button>
        <button type="button" data-valor="saiu">💸 Saiu</button>
        <button type="button" data-valor="diario">🛒 Diário</button>
      </div>

      <label>Valor (R$)</label>
      <input type="number" id="valor-lancar" step="0.01" min="0.01" inputmode="decimal" required>

      <label>Data</label>
      <input type="text" id="data-lancar" inputmode="numeric" placeholder="DD/MM/AAAA (ou só DD, ou DD/MM)" maxlength="10">

      <label>Descrição (opcional)</label>
      <input type="text" id="descricao-lancar" placeholder="Ex: mercado, salário...">

      <button type="submit" class="btn-principal" id="btn-lancar">Lançar</button>
    </form>
  </section>

  <!-- SALDO -->
  <section id="tab-saldo" class="tab-panel">
    <h2>Consultar saldo</h2>
    <label>Data</label>
    <input type="text" id="data-saldo" inputmode="numeric" placeholder="DD/MM/AAAA (ou só DD, ou DD/MM)" maxlength="10">
    <button type="button" class="btn-principal" id="btn-saldo">Consultar</button>
  </section>

  <!-- RELATÓRIO -->
  <section id="tab-relatorio" class="tab-panel">
    <h2>Relatório</h2>
    <label>Categoria</label>
    <div class="segmentado" id="tipo-relatorio">
      <button type="button" data-valor="entrou" class="selected">💵 Entrou</button>
      <button type="button" data-valor="saiu">💸 Saiu</button>
      <button type="button" data-valor="diario">🛒 Diário</button>
      <button type="button" data-valor="resumo">📈 Resumo</button>
    </div>

    <label>Período</label>
    <div class="segmentado" id="escopo-relatorio">
      <button type="button" data-valor="dia" class="selected">Um dia</button>
      <button type="button" data-valor="mes">Mês inteiro</button>
    </div>

    <div id="campo-data-relatorio">
      <label>Data</label>
      <input type="text" id="data-relatorio" inputmode="numeric" placeholder="DD/MM/AAAA (ou só DD, ou DD/MM)" maxlength="10">
    </div>
    <div id="campo-mes-relatorio" style="display:none">
      <label>Mês</label>
      <input type="text" id="mes-relatorio" inputmode="numeric" placeholder="MM/AAAA (ou só MM)" maxlength="7">
    </div>

    <button type="button" class="btn-principal" id="btn-relatorio">Consultar</button>
  </section>

  <!-- RESETAR -->
  <section id="tab-resetar" class="tab-panel">
    <h2>Zerar lançamento de um dia</h2>
    <label>Tipo</label>
    <div class="segmentado" id="tipo-resetar">
      <button type="button" data-valor="entrou" class="selected">💵 Entrou</button>
      <button type="button" data-valor="saiu">💸 Saiu</button>
      <button type="button" data-valor="diario">🛒 Diário</button>
    </div>

    <label>Data</label>
    <input type="text" id="data-resetar" inputmode="numeric" placeholder="DD/MM/AAAA (ou só DD, ou DD/MM)" maxlength="10">

    <button type="button" class="btn-principal btn-perigo" id="btn-resetar">Zerar</button>
  </section>

</div>

<script>
// ============================================================
// CONFIGURAÇÃO — cole aqui a URL do seu Web App do Apps Script
// (a mesma URL que está na propriedade WEBHOOK_URL do seu projeto)
// ============================================================
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyglll9rb8admb-pbRaIq6679NbIPPC3YvGjef1j1lodYhbRirWxMzifySI7hr9TAiV/exec";

const LABELS_TIPO = { entrou: "Entrou", saiu: "Saiu", diario: "Diário" };

const tg = window.Telegram && window.Telegram.WebApp;

let tipoLancar = "entrou";
let tipoRelatorio = "entrou";
let escopoRelatorio = "dia";
let tipoResetar = "entrou";

function hojeFormatado() {
  const hoje = new Date();
  const dia = String(hoje.getDate()).padStart(2, "0");
  const mes = String(hoje.getMonth() + 1).padStart(2, "0");
  return `${dia}/${mes}/${hoje.getFullYear()}`;
}

function mesAtualFormatado() {
  const hoje = new Date();
  return `${String(hoje.getMonth() + 1).padStart(2, "0")}/${hoje.getFullYear()}`;
}

function digitosDe(valor) {
  return String(valor || "").replace(/\D/g, "");
}

// Enquanto digita, insere as barras automaticamente (DD/MM/AAAA ou MM/AAAA)
function formatarEnquantoDigita(input, maxDigitos) {
  input.addEventListener("input", () => {
    const digitos = digitosDe(input.value).slice(0, maxDigitos);
    if (maxDigitos === 8) {
      input.value = digitos.length > 4
        ? `${digitos.slice(0, 2)}/${digitos.slice(2, 4)}/${digitos.slice(4)}`
        : digitos.length > 2
          ? `${digitos.slice(0, 2)}/${digitos.slice(2)}`
          : digitos;
    } else {
      input.value = digitos.length > 2 ? `${digitos.slice(0, 2)}/${digitos.slice(2)}` : digitos;
    }
  });
}

// Interpreta o texto digitado como data, aceitando:
// vazio (hoje), "DD" (dia, mês/ano atuais), "DDMM" (dia/mês, ano atual) ou "DDMMAAAA" (completo)
// Retorna "AAAA-MM-DD" ou null se inválido.
function resolverDataDigitada(idTexto) {
  const digitos = digitosDe(document.getElementById(idTexto).value);
  const hoje = new Date();
  let dia, mes, ano;

  if (digitos.length === 0) {
    dia = hoje.getDate();
    mes = hoje.getMonth() + 1;
    ano = hoje.getFullYear();
  } else if (digitos.length <= 2) {
    dia = Number(digitos);
    mes = hoje.getMonth() + 1;
    ano = hoje.getFullYear();
  } else if (digitos.length <= 4) {
    dia = Number(digitos.slice(0, 2));
    mes = Number(digitos.slice(2));
    ano = hoje.getFullYear();
  } else if (digitos.length === 8) {
    dia = Number(digitos.slice(0, 2));
    mes = Number(digitos.slice(2, 4));
    ano = Number(digitos.slice(4, 8));
  } else {
    return null;
  }

  if (!dia || dia < 1 || dia > 31 || !mes || mes < 1 || mes > 12) return null;
  return `${ano}-${String(mes).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;
}

// Mesma ideia, para o campo de mês: vazio (mês atual), "MM" ou "MMAAAA"
function resolverMesDigitado(idTexto) {
  const digitos = digitosDe(document.getElementById(idTexto).value);
  const hoje = new Date();
  let mes, ano;

  if (digitos.length === 0) {
    mes = hoje.getMonth() + 1;
    ano = hoje.getFullYear();
  } else if (digitos.length <= 2) {
    mes = Number(digitos);
    ano = hoje.getFullYear();
  } else if (digitos.length === 6) {
    mes = Number(digitos.slice(0, 2));
    ano = Number(digitos.slice(2, 6));
  } else {
    return null;
  }

  if (!mes || mes < 1 || mes > 12) return null;
  return `${ano}-${String(mes).padStart(2, "0")}`;
}

function aplicarTema() {
  if (!tg) return;
  const tp = tg.themeParams || {};
  const root = document.documentElement.style;
  root.setProperty("--bg", tp.bg_color || "#ffffff");
  root.setProperty("--text", tp.text_color || "#222222");
  root.setProperty("--hint", tp.hint_color || "#8e8e93");
  root.setProperty("--button", tp.button_color || "#2481cc");
  root.setProperty("--button-text", tp.button_text_color || "#ffffff");
  root.setProperty("--secondary-bg", tp.secondary_bg_color || "#f0f0f0");
  root.setProperty("--destructive", tp.destructive_text_color || "#e53935");
}

function mostrarAviso(mensagem) {
  if (tg && tg.showAlert) tg.showAlert(mensagem);
  else alert(mensagem);
}

function confirmarAcao(mensagem, callback) {
  if (tg && tg.showConfirm) tg.showConfirm(mensagem, callback);
  else callback(confirm(mensagem));
}

// --- inicialização ---
if (!tg || !tg.initData) {
  document.getElementById("aviso-fora").style.display = "block";
} else {
  tg.ready();
  tg.expand();
  aplicarTema();
  tg.onEvent("themeChanged", aplicarTema);
  document.getElementById("app").style.display = "block";

  document.getElementById("data-lancar").value = hojeFormatado();
  document.getElementById("data-saldo").value = hojeFormatado();
  document.getElementById("data-relatorio").value = hojeFormatado();
  document.getElementById("data-resetar").value = hojeFormatado();
  document.getElementById("mes-relatorio").value = mesAtualFormatado();

  formatarEnquantoDigita(document.getElementById("data-lancar"), 8);
  formatarEnquantoDigita(document.getElementById("data-saldo"), 8);
  formatarEnquantoDigita(document.getElementById("data-relatorio"), 8);
  formatarEnquantoDigita(document.getElementById("data-resetar"), 8);
  formatarEnquantoDigita(document.getElementById("mes-relatorio"), 6);
}

// --- abas ---
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

// --- segmentados (tipo / escopo) ---
function configurarSegmentado(containerId, onChange) {
  const container = document.getElementById(containerId);
  container.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => {
      container.querySelectorAll("button").forEach(x => x.classList.remove("selected"));
      b.classList.add("selected");
      onChange(b.dataset.valor);
    });
  });
}
configurarSegmentado("tipo-lancar", v => tipoLancar = v);
configurarSegmentado("tipo-resetar", v => tipoResetar = v);
configurarSegmentado("tipo-relatorio", v => tipoRelatorio = v);
configurarSegmentado("escopo-relatorio", v => {
  escopoRelatorio = v;
  document.getElementById("campo-data-relatorio").style.display = v === "dia" ? "block" : "none";
  document.getElementById("campo-mes-relatorio").style.display = v === "mes" ? "block" : "none";
});

// --- chamadas ao backend ---
async function chamarLeitura(params) {
  const url = new URL(APPS_SCRIPT_URL);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== null && v !== undefined && v !== "") url.searchParams.set(k, v);
  });
  url.searchParams.set("initData", tg.initData);
  const resp = await fetch(url.toString());
  return resp.json();
}

async function chamarEscrita(payload) {
  const resp = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...payload, initData: tg.initData }),
  });
  return resp.json();
}

// --- lançar ---
document.getElementById("form-lancar").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("btn-lancar");
  const dataResolvida = resolverDataDigitada("data-lancar");
  if (!dataResolvida) {
    mostrarAviso("⚠️ Data inválida. Digite DD, DD/MM ou DD/MM/AAAA.");
    return;
  }
  const payload = {
    acao: "lancar",
    tipo: tipoLancar,
    valor: document.getElementById("valor-lancar").value,
    data: dataResolvida,
    descricao: document.getElementById("descricao-lancar").value,
  };
  btn.disabled = true;
  btn.textContent = "Enviando...";
  try {
    const resposta = await chamarEscrita(payload);
    if (resposta.ok) {
      tg.close();
    } else {
      mostrarAviso("Erro: " + resposta.erro);
    }
  } catch (err) {
    mostrarAviso("Falha de conexão: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Lançar";
  }
});

// --- saldo ---
document.getElementById("btn-saldo").addEventListener("click", async () => {
  const dataResolvida = resolverDataDigitada("data-saldo");
  if (!dataResolvida) {
    mostrarAviso("⚠️ Data inválida. Digite DD, DD/MM ou DD/MM/AAAA.");
    return;
  }
  const btn = document.getElementById("btn-saldo");
  btn.disabled = true;
  try {
    const resposta = await chamarLeitura({ acao: "saldo", data: dataResolvida });
    if (resposta.ok) {
      tg.close();
    } else {
      mostrarAviso("Erro: " + resposta.erro);
    }
  } catch (err) {
    mostrarAviso("Falha de conexão: " + err.message);
  } finally {
    btn.disabled = false;
  }
});

// --- relatório ---
document.getElementById("btn-relatorio").addEventListener("click", async () => {
  const params = {
    acao: tipoRelatorio === "resumo" ? "resumo" : "historico",
    tipo: tipoRelatorio,
    escopo: escopoRelatorio,
  };
  if (escopoRelatorio === "mes") {
    const mesResolvido = resolverMesDigitado("mes-relatorio");
    if (!mesResolvido) {
      mostrarAviso("⚠️ Mês inválido. Digite MM ou MM/AAAA.");
      return;
    }
    const [ano, mes] = mesResolvido.split("-");
    params.mes = mes;
    params.ano = ano;
  } else {
    const dataResolvida = resolverDataDigitada("data-relatorio");
    if (!dataResolvida) {
      mostrarAviso("⚠️ Data inválida. Digite DD, DD/MM ou DD/MM/AAAA.");
      return;
    }
    params.data = dataResolvida;
  }

  const btn = document.getElementById("btn-relatorio");
  btn.disabled = true;
  try {
    const resposta = await chamarLeitura(params);
    if (resposta.ok) {
      tg.close();
    } else {
      mostrarAviso("Erro: " + resposta.erro);
    }
  } catch (err) {
    mostrarAviso("Falha de conexão: " + err.message);
  } finally {
    btn.disabled = false;
  }
});

// --- resetar ---
document.getElementById("btn-resetar").addEventListener("click", () => {
  const dataResolvida = resolverDataDigitada("data-resetar");
  if (!dataResolvida) {
    mostrarAviso("⚠️ Data inválida. Digite DD, DD/MM ou DD/MM/AAAA.");
    return;
  }
  const mensagem = `Confirma zerar ${LABELS_TIPO[tipoResetar]} do dia ${dataResolvida.split("-").reverse().join("/")}? Essa ação não pode ser desfeita.`;

  confirmarAcao(mensagem, async (confirmado) => {
    if (!confirmado) return;
    const btn = document.getElementById("btn-resetar");
    btn.disabled = true;
    try {
      const resposta = await chamarEscrita({ acao: "resetar", tipo: tipoResetar, data: dataResolvida });
      if (resposta.ok) {
        tg.close();
      } else {
        mostrarAviso("Erro: " + resposta.erro);
      }
    } catch (err) {
      mostrarAviso("Falha de conexão: " + err.message);
    } finally {
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
